# ============================================================
#  CONFIGURAÇÃO DO ROBÔ DE COBRANÇA — LEANKEEP (CB Jundiaí)
#  Edite no Bloco de Notas e reinicie o robô para valer.
#  Grupo/tópico e gestor são configurados pelo Telegram:
#  /configurar_topico (dentro do tópico) e /sou_gestor (no privado)
# ============================================================

fuso = "America/Sao_Paulo"

# Unidade cujas atividades serão cobradas (como aparece no Leankeep)
unidade = "CB JUNDIAÍ"

# Também cobrar atividades atrasadas de dias anteriores? (0 = só as do dia)
incluir_atrasadas_dias = 0

# Resumo para o gestor. Antes das 12h = resumo do DIA ANTERIOR (inclui o fechamento da madrugada)
resumo_diario = "07:00"

# 2º aviso: quantos minutos ANTES do prazo (0 = desligado)
aviso_antes_prazo_min = 30

# Copiar cada cobrança também no privado do gestor
copiar_cobrancas_gestor = true

# Palavras que, escritas no tópico Leankeep diário, fazem o robô conferir a baixa no Leankeep
palavras_baixa = ["baixei", "baixado", "baixada", "baixamos", "feito", "concluído", "concluída", "finalizado", "pronto", "realizado"]

# Depois do "baixei" (ou do botão "Baixa realizada"), espera X minutos antes de conferir no
# Leankeep (o app às vezes demora a sincronizar). Tudo baixado: ✅ no grupo.
# Ainda faltando: aviso SOMENTE no privado do gestor.
espera_conferencia_min = 15

# Nas cobranças do grupo, listar cada atividade pendente? false = forma macro (um item por plano, com a quantidade)
# (dá para ligar numa cobrança específica com listar_atividades = true no bloco dela)
listar_atividades = false

# Trechos removidos do fim das descrições do Leankeep (ex.: " - JUN")
remover_sufixos = [" - JUN"]

# Padrão: depois do prazo, cobra de novo a cada X minutos, até Y vezes
# (cada cobrança pode ter o seu: reforco_intervalo_min / reforco_maximo)
[reforco]
intervalo_min = 30
maximo = 2

# ------------------------------------------------------------
# COBRANÇAS — copie um bloco [[cobrancas]] para criar outra
#   aviso / prazo: horários. Prazo menor que o aviso = passa da meia-noite
#   palavras: trechos do nome da atividade/plano no Leankeep ([] = todas do dia)
#   excluir:  trechos que NÃO entram nesta cobrança
#   dias:     "seg","ter","qua","qui","sex","sab","dom"
#   (palavras/excluir só valem quando o robô estiver ligado ao Leankeep)
# ------------------------------------------------------------

[[cobrancas]]
nome = "Leitura de água, energia e gás"
aviso = "09:00"
prazo = "10:00"
palavras = ["LEITURA"]
excluir = ["QGBT"]
dias = ["seg", "ter", "qua", "qui", "sex", "sab", "dom"]
privado = true
responsaveis = []

[[cobrancas]]
nome = "Checklist de banheiros, brinquedoteca e salões"
aviso = "10:00"
prazo = "11:00"
palavras = ["BANHEIRO", "BRINQUEDOTECA", "SALAO", "SALOES"]
excluir = []
dias = ["seg", "ter", "qua", "qui", "sex", "sab", "dom"]
privado = true
responsaveis = []

[[cobrancas]]
nome = "Checklists da manutenção"
aviso = "16:00"
prazo = "18:00"
palavras = ["CHECKLIST: MANUTENCAO"]
excluir = ["BANHEIRO", "BRINQUEDOTECA", "SALAO", "SALOES", "LEITURA", "QGBT", "EXAUST", "INSUFLA", "FECHAMENTO", "DESLIGAMENTO", "BALCOES REFRIGERADOS"]
dias = ["seg", "ter", "qua", "qui", "sex", "sab", "dom"]
privado = true
responsaveis = []

[[cobrancas]]
nome = "Leitura do QGBT (domingo)"
aviso = "13:00"
prazo = "14:00"
palavras = ["QGBT"]
excluir = []
dias = ["dom"]
privado = true
responsaveis = []

[[cobrancas]]
nome = "Fechamento: exaustão/insuflamento, loja e registro de gás"
aviso = "23:30"
prazo = "02:00"            # madrugada do dia seguinte
palavras = ["EXAUST", "INSUFLA", "FECHAMENTO", "DESLIGAMENTO", "BALCOES REFRIGERADOS"]
excluir = []
dias = ["seg", "ter", "qua", "qui", "sex", "sab", "dom"]
privado = true
responsaveis = []
reforco_maximo = 0         # só cobra uma vez às 02:00 (sem reforços de madrugada)
avisar_baixa_atrasada = false   # fechamento costuma ser baixado depois do horário

# ------------------------------------------------------------
# OCORRÊNCIAS — fotos/mensagens do tópico de ocorrências viram pendências
#   Configure o tópico enviando /configurar_ocorrencias DENTRO dele.
# ------------------------------------------------------------
[ocorrencias]
ativo = true
lista_horario = "07:00"          # lista de pendências (tópico + privado do gestor)
confirmar_registro = true        # robô responde "📌 Ocorrência #N registrada" com botão
min_caracteres_texto = 15        # mensagem só de texto menor que isso não vira ocorrência
juntar_segundos = 120            # foto + texto da mesma pessoa em até 2 min = 1 ocorrência
palavras_resolvido = ["resolvido", "resolvida", "concluído", "concluída", "finalizado"]
palavras_andamento = ["em andamento", "andamento", "verificando", "vou verificar", "estou vendo"]
avisar_baixa_privado = true      # cada baixa chega no privado do gestor (foto, quem baixou, data) com botão Reativar

# ------------------------------------------------------------
# RESUMO SEMANAL (privado do gestor) — baixas no prazo x em atraso
#   Peça a qualquer momento: /semana (semana passada) ou /semana atual
# ------------------------------------------------------------
[resumo_semanal]
ativo = true
quando = "seg 08:00"             # dia e hora do envio (resume a semana anterior, seg a dom)
meta_atraso_pct = 5              # até 5% de atraso = 🟢
alerta_atraso_pct = 15           # até 15% = 🟡 ; acima = 🔴
fora_do_indice = ["FECHAMENTO DA LOJA"]   # aparece à parte, não conta no % de atraso

# Tolerância depois do horário limite: baixa até X horas depois conta como OK
# (compara com o nome do PLANO no Leankeep, igual à planilha de análise)
[[resumo_semanal.tolerancias]]
palavras = ["REGISTRO GAS", "REGISTRO DE GAS"]   # fechamento do registro de gás
horas = 3

[[resumo_semanal.tolerancias]]
palavras = ["EXAUST"]                           # desligamento da exaustão e insuflamento
horas = 3

# ------------------------------------------------------------
# LEMBRETE DIÁRIO NO GRUPO DE FECHAMENTO — conferir data/hora dos relógios
#   Configure enviando /configurar_fechamento DENTRO do grupo de fechamento.
# ------------------------------------------------------------
[lembrete_relogio]
ativo = true
horario = "23:00"

# ------------------------------------------------------------
# TAGME — fila de espera e reservas (grupo "Bot - Diretoria", tópico "Bot da Tagme")
#   Login: TAGME_EMAIL e TAGME_SENHA no arquivo .env
#   Configure o destino enviando /configurar_tagme DENTRO do tópico.
# ------------------------------------------------------------
[tagme]
ativo = true
venue_id = "1f1a2df6-d738-6510-844a-461e7b222271"   # Coco Bambu Jundiaí
intervalo_fila_seg = 60          # de quanto em quanto tempo olha a fila
avisar_fila_zerada = true
status_na_fila = ["waiting", "notified"]   # situações que contam como "na fila"
resumo_reservas = "10:00"        # horário do resumo diário
resumo_modo = "amanha"           # o resumo mostra as reservas de AMANHÃ

[tagme.periodos]
# Almoço até 17h; Jantar a partir das 17h (sem happy hour).
# Para voltar a ter happy hour, ponha o jantar_inicio depois do happy_hour_inicio (ex.: "20:00").
happy_hour_inicio = "17:00"
jantar_inicio = "17:00"

# ------------------------------------------------------------
# LEMBRETES PERSONALIZADOS — copie um bloco [[lembretes]] para criar outro
#   texto:   o que aparece em destaque (do jeito que você escrever)
#   horario: "HH:MM"
#   dias:    "seg","ter","qua","qui","sex","sab","dom"
#   marcar:  @usuários do Telegram (eles recebem notificação). Quem não tem @ pode ser
#            colocado pelo nome (ex.: "Gabrielle") — funciona se a pessoa já escreveu em algum grupo do robô
#   conferir: nome de uma cobrança acima: o robô consulta o Leankeep e SÓ manda o lembrete
#             se ainda houver pendência (e lista o que falta). Sem "conferir", sai sempre.
#   onde:    "leankeep" (tópico Leankeep diário), "ocorrencias", "fechamento", "tagme" ou "gestor"
#   ativo:   false para pausar sem apagar
#   Veja os cadastrados com /lembretes no Telegram.
# ------------------------------------------------------------
[[lembretes]]
texto = "FAZER LEITURA DE ÁGUA, ENERGIA E GÁS ATÉ AS 10h"
horario = "09:30"
dias = ["seg", "ter", "qua", "qui", "sex", "sab", "dom"]
conferir = "Leitura de água, energia e gás"
marcar = ["@Carlosh0512", "Gabrielle", "@WilmenOsorio", "@Rhayrodriguez", "@Glaubergois", "@Rinaldo_santana"]
onde = "leankeep"
ativo = true

[[lembretes]]
texto = "FAZER CHECKLIST DE BANHEIROS, BRINQUEDOTECA E SALÕES ATÉ AS 11h"
horario = "10:30"
dias = ["seg", "ter", "qua", "qui", "sex", "sab", "dom"]
conferir = "Checklist de banheiros, brinquedoteca e salões"
marcar = ["@Carlosh0512", "Gabrielle", "@WilmenOsorio", "@Rhayrodriguez", "@Glaubergois", "@Rinaldo_santana"]
onde = "leankeep"
ativo = true

[[lembretes]]
texto = "FAZER CHECKLISTS DA MANUTENÇÃO ATÉ AS 18h"
horario = "17:30"
dias = ["seg", "ter", "qua", "qui", "sex", "sab", "dom"]
conferir = "Checklists da manutenção"
marcar = ["@Carlosh0512", "Gabrielle", "@WilmenOsorio", "@Rhayrodriguez", "@Glaubergois", "@Rinaldo_santana"]
onde = "leankeep"
ativo = true

[[lembretes]]
texto = "FAZER LEITURA DO QGBT ATÉ AS 14h"
horario = "13:00"
dias = ["dom"]
conferir = "Leitura do QGBT (domingo)"
marcar = ["@Carlosh0512", "Gabrielle", "@WilmenOsorio", "@Rhayrodriguez", "@Glaubergois", "@Rinaldo_santana"]
onde = "leankeep"
ativo = true

# ------------------------------------------------------------
# ALERTAS (/alerta no privado do robô)
#   Toque num alerta pronto (ou escreva o seu) e escolha o tópico de destino.
#   marcar: quem é marcado em todos os alertas (um alerta pronto pode ter o seu próprio "marcar")
#   Para criar um alerta pronto, copie um bloco [[alertas.prontos]] e troque o texto.
#   detalhe (opcional): texto menor que aparece embaixo do título.
# ------------------------------------------------------------
[alertas]
marcar = ["@Carlosh0512", "Gabrielle", "@WilmenOsorio", "@Rhayrodriguez", "@Glaubergois", "@Rinaldo_santana"]

[[alertas.prontos]]
texto = "VERIFICAR O LEANKEEP AGORA"

[[alertas.prontos]]
texto = "CHECKLISTS ATRASADOS - BAIXAR NO LEANKEEP"

[[alertas.prontos]]
texto = "CONFERIR OS RELÓGIOS DO FECHAMENTO"

[[alertas.prontos]]
texto = "ATUALIZAR AS OCORRÊNCIAS PENDENTES"
detalhe = "Marquem 🟡 Em andamento ou ✅ Concluído no tópico Keepbot."

[[alertas.prontos]]
texto = "REUNIÃO DA MANUTENÇÃO EM 15 MINUTOS"


# ------------------------------------------------------------
# GITHUB: em cada rodada, o robô fica ouvindo por alguns segundos para
#   responder na hora quem está tocando nos botões (0 = desliga)
# ------------------------------------------------------------
[github]
escuta_segundos = 90

# ------------------------------------------------------------
# AVISOS NO PRIVADO DO GESTOR
#   mencoes: quando alguém marcar o seu @ num grupo onde o robô está, ele manda a mensagem no seu privado
#   meu_usuario: o seu @ (o robô também descobre sozinho quando você fala com ele)
# ------------------------------------------------------------
[avisos]
mencoes = true
meu_usuario = ""

