# ------------------------------------------------------------
# CARDÁPIO TAGME (cocobambu.tagme.menu) — o que entrou, saiu ou mudou de preço
#   Todo dia no privado do gestor, com foto, código e descrição de cada item. Só leitura.
#   Comandos: /cardapio (compara agora) · /cardapio_item 5099 (ou parte do nome)
# ------------------------------------------------------------
[cardapio]
ativo = true
horarios = ["10:00"]           # todo dia; a mensagem tem o botão 🔄 Atualizar agora para conferir na hora
store_id = 1217             # código da CB Jundiaí no cardápio da Tagme
max_cartoes = 15            # acima disso, o resto vem em lista

# ------------------------------------------------------------
# REGISTRAR OCORRÊNCIA NO LEANKEEP (pelo Telegram, no privado do gestor)
#   Cada ocorrência nova chega no seu privado com [📤 Registrar no Leankeep].
#   Grupo → Área → Prioridade → confere → registra com a foto. /registrar_leankeep 12 manda de novo.
# ------------------------------------------------------------
[leankeep_registro]
ativo = true

# ------------------------------------------------------------
# AUDITORIA (BATIDÃO) NO LEANKEEP – "Auditoria N" (N conta no mês, sem repetir)
#   • Toda segunda, no seu privado: "Abrir Auditoria N?" (só se ainda não houver uma da semana)
#   • /auditoria mostra a da semana e oferece abrir a próxima
#   • Ao registrar uma ocorrência pelo robô, ela entra na auditoria da semana
#     (ou abre a próxima na hora); sempre dá para registrar avulsa.
# ------------------------------------------------------------
[auditoria]
ativo = true
lembrete_semanal = true
quando = "seg 09:30"        # dia e hora da pergunta
dias_validade = 6           # auditoria com até 6 dias conta como "da semana"
comentario = "Aberta pelo robô do Telegram"

# ------------------------------------------------------------
# SEGUIMENTO NO LEANKEEP (Correções › Incluir Correção)
#   • Depois de registrar: botão [🔧 Dar seguimento] → escolhe o status → confere → grava
#   • /seguimento (lista as pendentes)  ·  /seguimento 31  ·  /seguimento D171431
#   • Para mudar a descrição ou mandar foto: responda a tela de conferência (texto ou foto)
#   • Solucionada exige foto: usa a da conclusão no grupo ou a que você mandar
#   • Ao concluir no grupo uma ocorrência que está no Leankeep, pergunta se baixa lá também
# ------------------------------------------------------------
[seguimento]
ativo = true
