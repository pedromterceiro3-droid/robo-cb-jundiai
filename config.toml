# ------------------------------------------------------------
# GITHUB: em cada rodada, o robô fica ouvindo por alguns segundos para
#   responder na hora quem está tocando nos botões (0 = desliga)
# ------------------------------------------------------------
[github]
escuta_segundos = 90

# ------------------------------------------------------------
# AVISOS NO PRIVADO DO GESTOR
#   mencoes: quando alguém marcar o seu @ num grupo onde o robô está, ele manda a mensagem no seu privado
#   meu_usuario: o seu @ (o robô também descobre sozinho quando você fala com ele)
# ------------------------------------------------------------
[avisos]
mencoes = true
meu_usuario = ""

# ------------------------------------------------------------
# BAIXA DECLARADA PELA EQUIPE (o site do Leankeep demora a atualizar)
#   Quando alguém toca "✅ Baixa realizada", escreve "baixei" ou posta FOTO no tópico Leankeep
#   durante uma cobrança, o robô para de cobrar aquela tarefa no grupo naquele dia.
#   Depois ele confere sozinho no Leankeep. Se mesmo assim continuar pendente,
#   avisa SÓ você, no privado.
# ------------------------------------------------------------
[baixa_declarada]
ativo = true
foto_conta = true              # foto postada no tópico durante a cobrança vale como "baixei"
conferir_apos_min = 60         # começa a conferir no Leankeep depois de 1h
avisar_gestor_apos_min = 240   # se depois de 4h ainda estiver pendente, avisa você no privado

# ------------------------------------------------------------
# BAR – grupo "CB Jundiaí - Bar" (Guide de Procedimentos Bar V7)
#   Configure cada tópico mandando, DENTRO dele: /topico_bar CHAVE  (chaves abaixo, em nomes_topicos)
#   A evidência é a postagem no tópico (foto, arquivo ou texto com 40+ letras).
#   Em tópico com mais de uma rotina, o robô pergunta com botões o que foi postado.
#   /bar no privado = situação de tudo; /farol = publica o farol no General.
# ------------------------------------------------------------
[bar]
ativo = true
marcar = ["@juliaRafaela", "@luizFelipe"]
silencio = ["01:30", "09:00"]      # nada é enviado nesse intervalo; o que cair nele sai às 09:00
resumo_noite = "01:20"             # resumo das rotinas diárias no seu privado
min_caracteres_texto = 40          # texto (sem foto) com menos que isso não conta como entrega
cobrar_grupo_uma_vez = true        # cobra 1 vez no grupo; as cobranças seguintes vão só para o seu privado
lembrete_no_grupo = true           # lembrete antes do prazo (⏰, sem marcar ninguém) também sai no grupo
agradecer = true                   # a cada entrega: reação na foto + mensagem de agradecimento respondendo a ela
reacao = "🙏"                      # reação usada (vale: 👍 ❤ 🔥 🎉 🙏 👏 🏆 💯 …)

[bar.farol]
ativo = true
dias = ["seg"]                     # toda segunda
horario = "10:00"
reforco_a_partir_do_dia = 25
dias_reforco = ["qui"]             # e também às quintas, a partir do dia 25
horario_fechamento = "20:00"       # no último dia do mês

